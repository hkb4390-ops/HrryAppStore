<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrry Direct Cloud Uploader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 30px 20px;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Upload Area */
        .drop-zone {
            border: 2px dashed var(--primary);
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .drop-zone:hover {
            background: #24334a;
        }

        .drop-zone i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        /* Progress Card */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .preview-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.2s;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* Result Link Card */
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--success);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .link-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .link-box input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .history-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .history-details {
            flex: 1;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .history-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-cloud-arrow-up"></i> Hrry Cloud</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('upload')">Uploader</button>
            <button class="tab-btn" onclick="switchTab('history')">My History</button>
        </div>
    </header>

    <div class="container">
        <!-- UPLOADER PANEL -->
        <div id="uploadPanel" class="panel active">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-file-circle-plus"></i>
                <h3>Click ya Drag karke file select karein</h3>
                <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 5px;">Supports Video, Photo, Audio & Documents</p>
                <input type="file" id="fileInput" class="file-input" onchange="handleFileSelect(event)">
            </div>

            <!-- Real-time Progress -->
            <div id="progressCard" class="progress-card">
                <div class="file-info">
                    <img id="previewImage" class="preview-thumb" src="https://via.placeholder.com/50?text=File" alt="Preview">
                    <div>
                        <div id="fileName" style="font-weight: 600;">FileName.mp4</div>
                        <div id="fileType" style="font-size: 0.8rem; color: var(--text-sub);">VIDEO</div>
                    </div>
                </div>

                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>

                <div class="stats-grid">
                    <div><i class="fa-solid fa-gauge"></i> Speed: <span id="speed">0 MB/s</span></div>
                    <div><i class="fa-solid fa-spinner"></i> Progress: <span id="percentage">0%</span></div>
                    <div><i class="fa-solid fa-hard-drive"></i> Size: <span id="sizeStats">0 / 0 MB</span></div>
                </div>
            </div>

            <!-- Success Card -->
            <div id="resultCard" class="result-card">
                <h3 style="color: var(--success);"><i class="fa-solid fa-circle-check"></i> Upload Completed!</h3>
                <div style="margin-top: 10px;">
                    <label style="font-size: 0.8rem; color: var(--text-sub);">Web Player Link:</label>
                    <div class="link-box">
                        <input type="text" id="playerLink" readonly>
                        <button class="btn" onclick="copyInput('playerLink')">Copy</button>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <label style="font-size: 0.8rem; color: var(--text-sub);">Direct Stream/Download Link:</label>
                    <div class="link-box">
                        <input type="text" id="streamLink" readonly>
                        <button class="btn" onclick="copyInput('streamLink')">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTORY PANEL -->
        <div id="historyPanel" class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Uploaded Files History</h2>
                <button class="btn btn-sm" style="background: #ef4444;" onclick="clearHistory()">Clear History</button>
            </div>
            <div id="historyContainer" class="history-list">
                <!-- History Items Rendered Here -->
            </div>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR RENDER BOT DOMAIN (Without trailing slash)
        const SERVER_URL = "https://telegram-stream-bot-r3kk.onrender.com/"; 

        let startTime, lastLoaded = 0;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            if (tab === 'upload') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('uploadPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('historyPanel').classList.add('active');
                renderHistory();
            }
        }

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('progressCard').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileType').innerText = file.type || "FILE";

            // Thumbnail generation
            const thumbUrl = await generateThumbnail(file);
            document.getElementById('previewImage').src = thumbUrl;

            // Upload handling
            uploadFile(file, thumbUrl);
        }

        function uploadFile(file, thumbUrl) {
            const formData = new FormData();
            formData.append('file', file);

            const xhr = new XMLHttpRequest();
            startTime = new Date().getTime();

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const now = new Date().getTime();
                    const duration = (now - startTime) / 1000;
                    
                    const percent = Math.round((e.loaded / e.total) * 100);
                    const speed = (e.loaded / (1024 * 1024 * duration)).toFixed(2); // MB/s
                    
                    const loadedMB = (e.loaded / (1024 * 1024)).toFixed(1);
                    const totalMB = (e.total / (1024 * 1024)).toFixed(1);

                    document.getElementById('progressBar').style.width = percent + '%';
                    document.getElementById('percentage').innerText = percent + '%';
                    document.getElementById('speed').innerText = speed + ' MB/s';
                    document.getElementById('sizeStats').innerText = `${loadedMB} / ${totalMB} MB`;
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    document.getElementById('resultCard').style.display = 'block';
                    document.getElementById('playerLink').value = response.player_link;
                    document.getElementById('streamLink').value = response.stream_link;

                    // Save item to My History
                    saveToHistory({
                        name: response.file_name,
                        size: (response.file_size / (1024 * 1024)).toFixed(2) + ' MB',
                        thumb: thumbUrl,
                        playerLink: response.player_link,
                        streamLink: response.stream_link,
                        date: new Date().toLocaleDateString()
                    });
                } else {
                    alert('Upload failed!');
                }
            };

            xhr.open('POST', `${SERVER_URL}/upload`, true);
            xhr.send(formData);
        }

        // Generate Preview Thumbnail for Videos and Images
        function generateThumbnail(file) {
            return new Promise((resolve) => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    video.src = URL.createObjectURL(file);
                    video.currentTime = 1;
                    video.onloadeddata = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 100;
                        canvas.height = 100;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, 100, 100);
                        resolve(canvas.toDataURL());
                    };
                    video.onerror = () => resolve('https://via.placeholder.com/60?text=Video');
                } else {
                    resolve('https://via.placeholder.com/60?text=File');
                }
            });
        }

        function saveToHistory(item) {
            let history = JSON.parse(localStorage.getItem('hrry_history') || '[]');
            history.unshift(item);
            localStorage.setItem('hrry_history', JSON.stringify(history));
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            let history = JSON.parse(localStorage.getItem('hrry_history') || '[]');

            if (history.length === 0) {
                container.innerHTML = `<p style="color: var(--text-sub); text-align: center;">Koi uploads history nahi mili.</p>`;
                return;
            }

            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <img src="${item.thumb}" alt="Thumb">
                    <div class="history-details">
                        <div class="history-title">${item.name}</div>
                        <div class="history-meta">${item.size} • ${item.date}</div>
                    </div>
                    <div class="history-actions">
                        <a href="${item.playerLink}" target="_blank" class="btn btn-sm">Play</a>
                        <button class="btn btn-sm" style="background:#475569;" onclick="navigator.clipboard.writeText('${item.streamLink}')">Copy Link</button>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem('hrry_history');
            renderHistory();
        }

        function copyInput(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
